<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Churn Prediction</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    .container {
      padding: 2rem 0;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      font-weight: bold;
      color: #333;
    }

    .form-control {
      border-color: #ddd;
    }

    .purple-border {
      border-left: 5px solid #8e44ad;
      padding-left: 1rem;
    }

    .btn-primary {
      background-color: #8e44ad;
      border-color: #8e44ad;
    }

    .output {
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      padding: 1rem;
    }
  </style>
</head>

<body>

  <div class="container">
    <form action="http://localhost:5000/" method="POST">
      <div class="row">
        <div class="col-sm-9">
          <h2 class="text-center">Customer Information</h2>
          <div class="form-group purple-border">
            <label for="comment">SeniorCitizen:</label>
            <textarea class="form-control" rows="2" id="query1" name="query1" rows="2" cols="5" autofocus>{{query1}}</textarea>
          </div>
          <div class="form-group purple-border">
            <label for="comment">MonthlyCharges:</label>
            <textarea class="form-control" rows="2" id="query2" name="query2" rows="2" cols="5" autofocus>{{query2}}</textarea>
          </div>
          <div class="form-group purple-border">
            <label for="comment">PaymentMethod:</label>
            <textarea class="form-control" rows="2" id="query18" name="query18" rows="2" cols="5" autofocus>{{query18}}</textarea>
          </div>
          <div class="form-group purple-border">
            <label for="comment">tenure:</label>
            <textarea class="form-control" rows="2" id="query19" name="query19" rows="2" cols="5" autofocus>{{query19}}</textarea>
          </div>
        </div>
        <div class="col-sm-3">
          <button type="submit" class="btn btn-primary btn-block" name="submit">SUBMIT</button>
        </div>
      </div>
    </form>

    <div class="row mt-4">
      <div class="col-sm-9">
        <h2>Prediction Results</h2>
        <div class="output">
          <textarea class="form-control" rows="2" id="comment" name="query6" rows="2" cols="5" autofocus>{{output1}}</textarea>
        </div>
        <div class="output">
          <textarea class="form-control" rows="2" id="comment" name="query7" rows="2" cols="5" autofocus>{{output2}}</textarea>
        </div>
      </div>
    </div>
  </div>

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>

</html>
